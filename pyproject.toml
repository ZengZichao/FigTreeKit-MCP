[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figtreekit-mcp"
version = "0.1.0"
description = "MCP server exposing FigTreeKit: validate, analyze, style, export and render phylogenetic trees for AI assistants"
readme = "README_EN.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Zeng Zichao", email = "zengzichao@sjtu.edu.cn" },
]
keywords = ["mcp", "phylogenetics", "figtree", "nexus", "newick", "tree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # PyPI users get the released figtreekit; development installs may point
    # this at a local checkout instead (see docs/development_guide_EN.md).
    "figtreekit>=1.1.4,<2",
    # 1.29+ is required for FastMCP's streamable-http transport and for the
    # low-level server version attribute used by create_server().
    "mcp>=1.29,<2",
]

[project.optional-dependencies]
render = ["pillow>=10.0"]
dev = [
    "pytest>=7.5",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
    "mypy>=1.8",
    "ruff>=0.5",
]

[project.scripts]
figtreekit-mcp = "figtreekit_mcp._cli:main"

[project.urls]
Homepage = "https://github.com/ZengZichao/FigTreeKit-MCP"
Documentation = "https://github.com/ZengZichao/FigTreeKit-MCP/blob/main/README_EN.md"
Repository = "https://github.com/ZengZichao/FigTreeKit-MCP"
"Bug Tracker" = "https://github.com/ZengZichao/FigTreeKit-MCP/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["figtreekit_mcp*"]

[tool.setuptools.package-data]
figtreekit_mcp = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The real-data equivalence/render tests can take several minutes on a
# 700-tip tree; keep a generous ceiling so a slow JVM is not mistaken for a
# hang, while still bounding genuinely stuck tests.
timeout = 1800
timeout_method = "thread"
markers = [
    "slow: slow tests (equivalence probe / real rendering)",
]
filterwarnings = [
    "default",
]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["figtreekit_mcp"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
